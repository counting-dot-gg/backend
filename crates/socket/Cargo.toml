[package]
name = "cgg-socket"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "counting.gg socket server: socket.io gateway, in-memory post path, WAL, MySQL persister"

[[bin]]
name = "cgg-socket"
path = "src/main.rs"

[dependencies]
cgg-core = { path = "../core" }
cgg-web = { path = "../web" }
counting = { path = "../counting" }
stats = { path = "../stats" }
progression = { package = "cgg-progression", path = "../progression" }
tokio = { workspace = true, features = ["full"] }
socket2 = "0.5"
libc = "0.2"
axum.workspace = true
socketioxide = { version = "0.18", features = ["extensions"] }
tower-http.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
sqlx.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
png = "0.17"
crc32fast = "1"
urlencoding = "2"
dashmap = "5"
parking_lot = "0.12"
fastrand.workspace = true
getrandom.workspace = true
anyhow.workspace = true
tracing.workspace = true
chrono-tz.workspace = true
mimalloc = { version = "0.1", default-features = false }
redis = { workspace = true, features = ["connection-manager"] }
indexmap = { version = "2", features = ["serde"] }
chrono.workspace = true
regex = "1"

[lints]
workspace = true
